name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openwrt-24.10-ipk
            base: https://downloads.openwrt.org/releases
            version: '24.10.8'
            target: x86/64
            prefix: openwrt-sdk-
            artifact: ipk
          - name: openwrt-25.12-apk
            base: https://downloads.openwrt.org/releases
            version: '25.12.6'
            target: x86/64
            prefix: openwrt-sdk-
            artifact: apk
          - name: immortalwrt-25.12-apk
            base: https://downloads.immortalwrt.org/releases
            version: '25.12.2'
            target: x86/64
            prefix: immortalwrt-sdk-
            artifact: apk

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext unzip file libncurses-dev libssl-dev rsync zstd python3

      - name: Fetch SDK
        run: |
          set -euo pipefail
          DIR_URL="${{ matrix.base }}/${{ matrix.version }}/targets/${{ matrix.target }}/"
          echo "SDK index: $DIR_URL"
          URL=$(curl -fsSL "$DIR_URL" \
            | grep -oE '${{ matrix.prefix }}[^"]*x86-64[^"]*Linux-x86_64\.tar\.(zst|xz)' \
            | sort -u | head -1)
          if [ -z "${URL:-}" ]; then
            echo "::error title=SDK not found::$DIR_URL"
            exit 1
          fi
          echo "SDK: $URL"
          curl -fL -o sdk.tar "$DIR_URL$URL"
          mkdir -p sdk
          case "$URL" in
            *.tar.zst) tar --use-compress-program=unzstd -xf sdk.tar -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk.tar -C sdk --strip-components=1 ;;
          esac
          echo "SDK_DIR=$PWD/sdk" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          set -uo pipefail
          cd "$SDK_DIR"
          mkdir -p package
          cp -a "$GITHUB_WORKSPACE" package/luci-app-komari
          rm -rf package/luci-app-komari/.git

          if ! make defconfig > /tmp/defconfig.log 2>&1; then
            echo "::error title=defconfig failed::$(tail -6 /tmp/defconfig.log | tr '\n' ' ' | cut -c1-800)"
            tail -40 /tmp/defconfig.log
            exit 1
          fi

          if ! make package/luci-app-komari/compile V=s -j"$(nproc)" > /tmp/build.log 2>&1; then
            msg=$(grep -m3 -E 'Error|error:|No rule|not found|failed' /tmp/build.log | tr '\n' ' ' | cut -c1-800)
            echo "::error title=build failed::${msg:-see log}"
            tail -60 /tmp/build.log
            exit 1
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/${{ matrix.name }}"
          find "$SDK_DIR/bin/packages" -type f -name "luci-app-komari*.${{ matrix.artifact }}" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/${{ matrix.name }}/" \;

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
